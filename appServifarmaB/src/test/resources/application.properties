# ==============================================================
# CONFIGURACIÓN PARA TESTS (mvn test)
# Sobrescribe src/main/resources/application.properties durante tests
# No depende de variables de entorno → los tests corren en cualquier PC
# ==============================================================

spring.application.name=appServifarmaB

# --------------------------------------------------------------
# Base de datos H2 en memoria (reemplaza a MySQL)
# --------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# --------------------------------------------------------------
# JPA / Hibernate (compatible con H2)
# --------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# --------------------------------------------------------------
# JWT (valores dummy para tests)
# --------------------------------------------------------------
jwt.secret=TestSecretKeyForUnitTestsOnly_32CharsMinimumLength_OK
jwt.expiration=86400000

# --------------------------------------------------------------
# Logging (menos ruido durante tests)
# --------------------------------------------------------------
logging.level.com.example.proyecto.app.security=WARN
logging.level.org.springframework.security=WARN
logging.level.root=WARN

# --------------------------------------------------------------
# JSON.pe / RENIEC (dummy)
# --------------------------------------------------------------
jsonpe.api-key=test-jsonpe-api-key-dummy

# --------------------------------------------------------------
# Server
# --------------------------------------------------------------
server.port=0
spring.main.allow-bean-definition-overriding=true
spring.main.allow-circular-references=true

# --------------------------------------------------------------
# CORS
# --------------------------------------------------------------
app.cors.allowed-origins=http://localhost:4200
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true

# --------------------------------------------------------------
# Static Resources
# --------------------------------------------------------------
spring.web.resources.static-locations=classpath:/static/,file:uploads/
spring.web.resources.add-mappings=true

# --------------------------------------------------------------
# Mail (dummy para que no intente conectarse)
# --------------------------------------------------------------
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@test.com
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# --------------------------------------------------------------
# Cloudinary (dummy)
# --------------------------------------------------------------
cloudinary.cloud-name=test-cloud
cloudinary.api-key=test-key
cloudinary.api-secret=test-secret

# --------------------------------------------------------------
# Desactivar tareas programadas en tests
# --------------------------------------------------------------
spring.task.scheduling.enabled=false

# --------------------------------------------------------------
# Desactivar SpringDoc en tests (menos ruido)
# --------------------------------------------------------------
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false